<!--
  Activity bar icon.

  VS Code renders this as a monochrome mask, so the source artwork's blue,
  yellow and grey are all discarded. In the original the four bars touch, which
  as a single-colour silhouette collapses into one solid staircase — so they are
  separated here, and the gaps are a full 1.5 units because anything thinner
  disappears when the icon is drawn at 24px on a non-retina display.

  Bar heights keep the proportions of the original: tops at 0%, 27%, 54% and
  79% of the plot height.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <rect x="2"    y="3"     width="3.9" height="18"/>
  <rect x="7.4"  y="7.85"  width="3.9" height="13.15"/>
  <rect x="12.8" y="12.7"  width="3.9" height="8.3"/>
  <rect x="18.2" y="17.3"  width="3.9" height="3.7"/>
</svg>
